[package]
publish = false
name = "hardwave-daw"
version.workspace = true
edition.workspace = true

[features]
default = []
jack = ["hardwave-engine/jack"]
asio = ["hardwave-engine/asio"]
# The Dev Panel's commands (state dump, forced device error, test files).
# On in debug builds and the signed test builds; never in a release.
dev-tools = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
hardwave-engine = { path = "../crates/hardwave-engine" }
hardwave-project = { path = "../crates/hardwave-project" }
hardwave-plugin-host = { path = "../crates/hardwave-plugin-host" }
hardwave-metering = { path = "../crates/hardwave-metering" }
hardwave-midi = { path = "../crates/hardwave-midi" }
hardwave-dsp = { path = "../crates/hardwave-dsp" }
hardwave-native-plugins = { path = "../crates/hardwave-native-plugins" }
raw-window-handle.workspace = true

tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
parking_lot.workspace = true
dirs.workspace = true
log.workspace = true
env_logger.workspace = true
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

# Frontend updater — see `src/frontend_updater.rs`. Lets us hot-swap the
# React bundle on app launch without forcing customers to reinstall.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
hex = "0.4"
semver = "1"
# Tiny dep used only by frontend_updater::validate_cached_bundle to scan
# index.html for src/href asset references. We strip prefixes manually
# rather than parse HTML — the regex is enough for Vite's emit format.
regex = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
url = "2"

hound.workspace = true
flacenc.workspace = true
shine-rs.workspace = true
# Used by Project Info dialog handlers to stamp modified_at on metadata
# changes (RFC3339). chrono is already a workspace dep — wire it through.
chrono.workspace = true
vorbis_rs.workspace = true
trash = "5"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
# zip turns flate2 on without a backend; this picks the pure-Rust one. On
# Linux another crate happened to pick it, so only the Windows build failed.
flate2 = "1"
rhai = { version = "1.26.1", default-features = false, features = ["std", "sync"] }
# The room connection's TLS is set up in commands/collab.rs with the Mozilla
# roots from webpki-roots 1.x. tokio-tungstenite's own rustls-tls-webpki-roots
# feature brought in webpki-roots 0.26, which RustSec flags (RUSTSEC-2026-0381);
# the system's store is no substitute on Windows, where roots such as ISRG
# Root X2 arrive only when Windows itself asks for them.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false }
webpki-roots = "1"

# Real process memory for the toolbar's MEM meter. The meter used to read the
# WebView's JS heap, which says nothing about the sample pool, the audio graph
# or the plug-ins — all of which live in this process. Already in the tree via
# tauri, so this adds no download.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    # process_memory.rs (GlobalMemoryStatusEx). It came in through another
    # crate's features until the room TLS change, and the build broke.
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The mock runtime, so a test can call commands the way a page does and
# prove which pages may.
tauri = { workspace = true, features = ["test"] }
axum = "0.8"
tempfile = "3"

[lib]
name = "hardwave_daw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

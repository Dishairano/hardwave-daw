name: Dev Build
# Per-run display label so the Actions list distinguishes branch /
# manual / scheduled triggers at a glance instead of a wall of "Dev Build".
run-name: Dev Build · ${{ github.ref_name }} · ${{ github.sha }}

# Builds Tauri installers for Win/Mac/Linux WITHOUT creating a public
# GitHub Release, WITHOUT bumping the version, and WITHOUT posting to
# Discord. Installers are uploaded as workflow artifacts so they can be
# downloaded from the Actions run page for ad-hoc testing.
#
# Triggers:
#   - push to redesign-port-from-master (or master) — auto-build on every push
#   - workflow_dispatch — manual "Run workflow" button on any branch
#
# To download an installer:
#   1. Go to https://github.com/Dishairano/hardwave-daw/actions
#   2. Click the latest "Dev Build" run on your branch
#   3. Scroll to the "Artifacts" section
#   4. Download "windows-installer" / "macos-installer" / "linux-installer"

# CI-minutes hygiene (2026-07-06): no longer fires on every push. We release
# per feature (each v* tag runs the full 3-platform Release matrix minutes
# later) and fast-windows.yml covers "quick Windows exe" — the per-push
# 3-platform dev build was near-pure duplication. Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which platforms to build (comma-separated: windows,macos,linux,all)'
        required: false
        default: 'all'

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/daw-ui/package-lock.json

      - name: Build frontend
        run: |
          cd packages/daw-ui
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: packages/daw-ui/dist
          retention-days: 1

  # Mirrors the `fmt` + `clippy` + `test` jobs from `ci.yml` (which only
  # runs on master). Without this, regression tests added in v0.164.5
  # and beyond would only execute on merge to master — feature branches
  # could land broken assertions undetected.
  lint-and-test:
    name: Lint & Test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: dev-lint-and-test
          cache-on-failure: true

      # No sccache here on purpose — when the Azure-backed GHA cache
      # backend goes down (returns 503), the `RUSTC_WRAPPER=sccache`
      # env var keeps every rustc/clippy invocation failing with
      # "cache storage failed to read". rust-cache@v2 above already
      # restores `target/` between runs, which is the bulk of what
      # sccache buys us here. Platform builds (Win/Mac/Linux installer
      # jobs below) still use sccache because their compile time is
      # much higher.

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libjack-jackd2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            mold clang

      - name: cargo fmt --check
        run: cargo fmt --check

      # Clippy advisory only — the workspace inherited a deep stack of
      # pre-existing clippy warnings that block every branch build if
      # treated as errors. We surface them via continue-on-error so they
      # show up red in the run summary as a TODO list, but the job stays
      # green. The strict gate on master (ci.yml) keeps the standard for
      # any merge into main — branch builds just don't block on it.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test --workspace
        # Runs library unit tests AND `tests/` integration tests
        # (functional_smoke.rs in hardwave-engine). The integration
        # tests boot a real DawEngine and exercise end-to-end paths —
        # they're the regression gate for beta blockers #4/#5 (live
        # MIDI input → audible output) plus the existing audio
        # rendering + master volume coverage. `--ignored` tests stay
        # opt-in via the dedicated functional-smoke.yml job.
        run: cargo test --workspace

  build:
    name: ${{ matrix.label }}
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows installer
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-installer
            bundle_glob: target/x86_64-pc-windows-msvc/release/bundle/**/*
          - label: macOS installer
            platform: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-installer
            bundle_glob: target/aarch64-apple-darwin/release/bundle/**/*
          - label: Linux installer
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-installer
            bundle_glob: target/x86_64-unknown-linux-gnu/release/bundle/**/*

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download frontend artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist
          path: packages/daw-ui/dist

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: dev-${{ matrix.target }}
          cache-on-failure: true

      - name: Install sccache
        uses: mozilla-actions/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7
        continue-on-error: true

      - name: Configure sccache
        shell: bash
        run: |
          if sccache --start-server 2>/dev/null; then
            echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libjack-jackd2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            mold clang
          echo "RUSTFLAGS=-C linker=clang -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Fetch ASIO SDK (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $url = 'https://www.steinberg.net/asiosdk'
          $dest = "$env:RUNNER_TEMP\asiosdk.zip"
          $out  = "$env:RUNNER_TEMP\asiosdk"
          Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
          Expand-Archive -Path $dest -DestinationPath $out -Force
          $sdkRoot = Get-ChildItem -Path $out -Directory | Select-Object -First 1
          echo "CPAL_ASIO_DIR=$($sdkRoot.FullName)" >> $env:GITHUB_ENV

      - name: Resolve LLVM (Windows — required by cpal/asio bindgen)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvmBin\libclang.dll")) {
            choco install llvm -y --no-progress --force
          }
          echo "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          # Same lld-link switch as release.yml — keeps dev builds in sync
          # with what release builds use, so we surface linker problems
          # before tagging a release.
          echo "$llvmBin" >> $env:GITHUB_PATH
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link.exe" >> $env:GITHUB_ENV

      - name: Install Tauri CLI
        # PINNED. `@latest` picked up 2.12.0 on 2026-09-26, whose NSIS
        # template calls RestartManager macros that the nsis_tauri_utils it
        # downloads does not define, so every Windows build died with
        # `macro named "RestartManager_StartSession" not found` (v0.230.0).
        # Move this forward deliberately, together with the tauri crate.
        run: npm install -g @tauri-apps/cli@2.11.5

      # Build via tauri-action with empty tagName — produces installers WITHOUT
      # creating a GitHub Release. No updater signing key: these are test
      # builds, not updates. We then upload the bundle output as a
      # workflow artifact below.
      - name: Build Linux (with JACK)
        if: matrix.platform == 'ubuntu-22.04'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ''
          tauriScript: tauri
          args: --target ${{ matrix.target }} --features jack --config src-tauri/tauri.unsigned.conf.json

      - name: Build Windows (with ASIO)
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CPAL_ASIO_DIR: ${{ env.CPAL_ASIO_DIR }}
          LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}
        with:
          tagName: ''
          tauriScript: tauri
          args: --target ${{ matrix.target }} --features asio --config src-tauri/tauri.unsigned.conf.json

      - name: Build macOS
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ''
          tauriScript: tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.unsigned.conf.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_glob }}
          retention-days: 14
          if-no-files-found: error

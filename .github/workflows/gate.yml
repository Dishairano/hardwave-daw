# Fast gate on the founder's Windows PC.
#
# The release gate (fmt + clippy + cargo test --workspace) takes about 15
# minutes on web01: 2 cores, 3.7 GB RAM shared with the production site, and
# cold Rust builds must run single-job or the OOM killer takes them. The same
# gate on a real desktop with a warm target directory is 2 to 3 minutes.
#
# This runs on every push to the working branch so a tag is only ever cut on
# a tree that has already been proven green. It deliberately does NOT gate the
# release: release.yml keeps its own Lint & Test job on a GitHub runner, so a
# tag still works when the PC is off.
name: Gate

on:
  push:
    branches:
      - redesign-port-from-master
      - master
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: [self-hosted, Windows, hardwave-daw]
    timeout-minutes: 45
    # cmd, not PowerShell: the PC has no pwsh, and its execution policy
    # refuses to run the .ps1 files Actions writes for every step. cmd needs
    # no machine change. Steps stay one command each so a failure cannot hide
    # behind a later success.
    defaults:
      run:
        shell: cmd
    env:
      CARGO_NET_RETRY: 10
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4

      # First run doubles as a machine census: how much this box can take
      # (build jobs, whether it can host heavier work later).
      # -ExecutionPolicy Bypass applies to this one process only, so the
      # machine's policy stays exactly as it is.
      - name: Machine
        run: powershell -NoProfile -ExecutionPolicy Bypass -Command "Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List; '{0:N1} GB RAM' -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB); Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}},@{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}} | Format-Table"

      - name: Tool versions
        run: node --version && npm --version

      # Not dtolnay/rust-toolchain: that action shells out to bash, and on
      # this PC `bash` resolves to WSL, which has no distribution installed.
      # rustup is installed directly instead, and rust-toolchain.toml pins
      # the version (with rustfmt and clippy) on the first cargo call, so
      # this runner cannot drift from CI either.
      - name: Install rustup if missing
        run: where rustup || (curl -sSfLo "%RUNNER_TEMP%\rustup-init.exe" https://win.rustup.rs/x86_64-msvc && "%RUNNER_TEMP%\rustup-init.exe" -y --profile minimal --default-toolchain none --no-modify-path)

      - name: Put cargo on PATH
        run: echo %USERPROFILE%\.cargo\bin>>%GITHUB_PATH%

      - name: Install the pinned toolchain
        run: rustup show && rustc -V && cargo -V

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Frontend install
        working-directory: packages/daw-ui
        run: npm ci

      - name: Frontend typecheck
        working-directory: packages/daw-ui
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: packages/daw-ui
        run: npm run test:unit

      - name: Frontend build
        working-directory: packages/daw-ui
        run: npm run build

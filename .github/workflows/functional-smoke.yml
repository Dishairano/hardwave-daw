name: Functional Smoke
run-name: Functional Smoke · ${{ github.ref_name }}

# Runs `crates/hardwave-engine/tests/functional_smoke.rs` — the tests that
# boot the real DawEngine, render audio offline and assert on the output
# buffer. This is the layer that catches "vapor features": code that
# compiles and unit-tests fine but never reaches the audio graph.
#
# History: this job used to run only the `#[ignore]`d "killer-watch" tests
# (`-- --ignored`) and reported non-blocking. As of 2026-07-19 there are no
# ignored tests left — the two killer-watch panics were re-verified, found
# to be guarding features that are in fact wired, and rewritten as real
# end-to-end coverage. The old status board also keyed off test names that
# no longer exist (killer_midi_note_produces_sound, killer_recording_writes_clip,
# killer_automation_changes_parameter), so it reported permanent false "VAPOR".
# The job now runs the whole suite and blocks, which is what actually
# protects the audio path.

on:
  push:
    branches:
      - master
      - redesign-port-from-master
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches:
      - master
      - redesign-port-from-master

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional-smoke:
    name: Functional smoke (audio behaviour)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libjack-jackd2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        continue-on-error: true

      - name: Configure sccache
        run: |
          if sccache --start-server 2>/dev/null; then
            echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          fi

      - name: Run functional smoke tests
        run: |
          cargo test \
            --test functional_smoke \
            -p hardwave-engine \
            -- --nocapture --test-threads=1

      - name: Run native-plugin render proof
        run: |
          cargo test \
            --test render_fx_wav \
            -p hardwave-native-plugins \
            -- --nocapture

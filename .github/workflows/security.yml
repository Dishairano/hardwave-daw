name: Security
run-name: Security · ${{ github.ref_name }}

# The security gate. Every push and pull request, and every Monday so a
# new advisory against something already shipped shows up without
# waiting for a commit.
#
# - Rust dependencies: known vulnerabilities, yanked crates, licences
#   and sources, per deny.toml. A vulnerability fails; there is no warn.
# - UI dependencies: npm audit on the lockfile, including build tools.
# - Secrets: gitleaks over the whole history.
#
# It runs on GitHub's machines, never the founder's PC, with a read-only
# token and actions pinned to a commit, so a moved tag upstream cannot
# change what runs here.

on:
  push:
    branches: [master, redesign-port-from-master]
  pull_request:
    branches: [master, redesign-port-from-master]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-dependencies:
    name: Rust dependencies (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  ui-dependencies:
    name: UI dependencies (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Audit the lockfile
        working-directory: packages/daw-ui
        run: npm audit --audit-level=moderate

  ui-content-policy:
    name: App window content policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Build the UI
        working-directory: packages/daw-ui
        run: npm ci && npm run build
      - name: Browser for the check
        working-directory: packages/daw-ui
        run: npx playwright install --with-deps chromium
      - name: Load the build under the app's policy; anything blocked fails
        working-directory: packages/daw-ui
        run: npm run check:csp

  secrets:
    name: Secrets in history (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch gitleaks, checked against its published hash
        run: >-
          curl -sSLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          && echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          && tar xzf gitleaks.tgz gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

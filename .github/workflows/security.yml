name: Security
run-name: Security · ${{ github.ref_name }}

# The security gate. Every push and pull request, and every Monday so a
# new advisory against something already shipped shows up without
# waiting for a commit.
#
# The checks themselves live in secure-code-check.yml, shared with the
# Suite and the plug-ins, so the release runs exactly the same ones on
# its tag:
#
# - Rust dependencies of the DAW and of the launcher: known
#   vulnerabilities, yanked crates, licences and sources, per deny.toml.
#   A vulnerability fails; there is no warn.
# - npm dependencies: the interface with its build tools, and what the
#   launcher ships.
# - Secrets: gitleaks over the whole history.
# - Static analysis: Semgrep's free security rules; a high finding fails.
# - Fuzzing: every reader of outside input (songs, FL files, audio
#   headers, plug-in state and bridge, OSC, room messages, sample
#   paths) fed generated input; anything that panics, hangs or runs out
#   of memory fails. A minute per target on a push, ten every Monday.
# - The app window's content policy, and an SBOM of what ships.
#
# It runs on GitHub's machines, never the founder's PC, with a read-only
# token and actions pinned to a commit, so a moved tag upstream cannot
# change what runs here. release.sh tags only once this run is green on
# the commit being released; the workflow keeps the name "Security"
# because that is what it waits for.

on:
  push:
    branches: [master, redesign-port-from-master]
  pull_request:
    branches: [master, redesign-port-from-master]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Secure Code Check
    uses: ./.github/workflows/secure-code-check.yml
    with:
      tools-ref: ${{ github.sha }}
      cargo-manifests: |
        Cargo.toml
        installer/src-tauri/Cargo.toml
      # The interface with its build tools; the launcher's shipped packages
      # only (its vite 5 and tailwind 3 need major upgrades to clear their
      # advisories and are audited once those are done).
      npm-audit: |
        packages/daw-ui
        installer --omit=dev
      semgrep-languages: rust typescript javascript
      fuzz: true
      # The audio crates link ALSA through alsa-sys.
      fuzz-apt-packages: libasound2-dev pkg-config
      content-policy-dir: packages/daw-ui
      fuzz-seconds: ${{ github.event_name == 'schedule' && 600 || 60 }}
    secrets:
      SECURE_CODE_CHECK_SIGNING_KEY: ${{ secrets.SECURE_CODE_CHECK_SIGNING_KEY }}

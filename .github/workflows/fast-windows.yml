# Fast Windows-only build for debug iterations.
#
# The full Release pipeline gates on lint+test, then builds Linux + Windows +
# macOS (~25 min tag-to-installer). When we're iterating on a Windows-specific
# bug (e.g. the detached-window white screen) we only need the Windows .exe —
# this lane skips the gate (we run fmt/clippy/tests locally before pushing),
# builds one platform, and publishes to a ROLLING prerelease with a stable
# download URL:
#
#   https://github.com/Dishairano/hardwave-daw/releases/download/fast-build/Hardwave.DAW_fast_x64-setup.exe
#
# Trigger:  push a `fast-v*` tag (works from any branch — tag-push workflows
# run from the tag's commit, no default-branch registration needed):
#
#   git tag fast-v1 && git push origin fast-v1
#
# (`fast-v*` does not match release.yml's `v*` glob, so the full release
# pipeline does not fire.) The `fast-build` release is marked prerelease so
# it can never become `releases/latest` — the auto-updater feed (latest.json)
# is untouched.
name: Fast Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'fast-v*'

concurrency:
  group: fast-windows
  cancel-in-progress: true

# Read-only, except the one job that publishes the test build.
permissions:
  contents: read

jobs:
  fast-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Build frontend
        shell: bash
        run: |
          cd packages/daw-ui
          npm ci || npm install
          npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-pc-windows-msvc

      # Same shared-key as the release matrix so this lane REUSES the release
      # build's warm cache instead of compiling cold.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: x86_64-pc-windows-msvc
          cache-on-failure: true

      - name: Install sccache
        uses: mozilla-actions/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7
        continue-on-error: true

      - name: Configure sccache
        shell: bash
        run: |
          if sccache --start-server 2>/dev/null; then
            echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "sccache available"
          else
            echo "sccache unavailable, building without cache"
          fi

      - name: Fetch ASIO SDK
        shell: pwsh
        run: |
          $url = 'https://www.steinberg.net/asiosdk'
          $dest = "$env:RUNNER_TEMP\asiosdk.zip"
          $out  = "$env:RUNNER_TEMP\asiosdk"
          Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
          Expand-Archive -Path $dest -DestinationPath $out -Force
          $sdkRoot = Get-ChildItem -Path $out -Directory | Select-Object -First 1
          echo "CPAL_ASIO_DIR=$($sdkRoot.FullName)" >> $env:GITHUB_ENV

      - name: Install LLVM (bindgen + lld-link)
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvmBin\libclang.dll")) {
            choco install llvm -y --no-progress --force
          }
          echo "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          echo "$llvmBin" >> $env:GITHUB_PATH
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link.exe" >> $env:GITHUB_ENV

      - name: Install Tauri CLI
        # PINNED. `@latest` picked up 2.12.0 on 2026-09-26, whose NSIS
        # template calls RestartManager macros that the nsis_tauri_utils it
        # downloads does not define, so every Windows build died with
        # `macro named "RestartManager_StartSession" not found` (v0.230.0).
        # Move this forward deliberately, together with the tauri crate.
        run: npm install -g @tauri-apps/cli@2.11.5

      - name: Build Windows installer (nsis only)
        shell: bash
        env:
        run: tauri build --target x86_64-pc-windows-msvc --features asio --bundles nsis

      - name: Publish to rolling fast-build prerelease (stable URL)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cargo workspace → target/ lives at the repo root (not src-tauri/).
          # find covers both layouts so a tauri-cli change can't break this.
          exe=$(find . -path '*/release/bundle/nsis/*.exe' -not -path './node_modules/*' | head -1)
          echo "installer: $exe"
          cp "$exe" "Hardwave.DAW_fast_x64-setup.exe"
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release create fast-build --prerelease \
            --title "Fast Windows build (rolling)" \
            --notes "Rolling debug build — do not use as a normal release." \
            2>/dev/null || true
          gh release upload fast-build "Hardwave.DAW_fast_x64-setup.exe" --clobber
          gh release edit fast-build --notes "Rolling debug build from \`$GITHUB_REF_NAME\` @ \`${GITHUB_SHA::8}\` (v$ver, $(date -u +%Y-%m-%dT%H:%MZ)). Do not use as a normal release."
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/download/fast-build/Hardwave.DAW_fast_x64-setup.exe"

      # Belt-and-braces: also attach as a workflow artifact.
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Hardwave.DAW_fast_x64-setup
          path: Hardwave.DAW_fast_x64-setup.exe

      # Tag hygiene: fast-v* tags are one-shot triggers, not history. Delete
      # the trigger tag after a successful publish so they don't pile up.
      - name: Delete trigger tag
        if: startsWith(github.ref, 'refs/tags/fast-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push origin ":${GITHUB_REF}" || true

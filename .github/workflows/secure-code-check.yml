name: Secure Code Check

# The security checks for one Hardwave product, as a reusable workflow.
# Each product calls it from its own security.yml (every push, pull
# request and Monday) and again from its release workflow on the tag; a
# release builds only when every job here is green.
#
# Call it pinned to a commit, and pass the same commit as tools-ref, so
# the scripts that write the report are the ones this file was tested
# with:
#
#   uses: Dishairano/hardwave-daw/.github/workflows/secure-code-check.yml@<sha>
#   with:
#     tools-ref: <sha>
#
# What it checks:
# - Rust dependencies, per lock file: known vulnerabilities, yanked
#   crates, unmaintained crates we depend on ourselves, licences and
#   download sources, against the product's deny.toml (cargo deny). A
#   vulnerability fails; there is no warn.
# - npm dependencies, per folder (npm audit), when the product has any.
# - Secrets in the whole git history (gitleaks).
# - The source itself for known flaw patterns (Semgrep, free rules). A
#   high finding fails; lower ones are listed in the report.
# - Optional: every fuzz target under fuzz/ (cargo fuzz), and the built
#   interface loaded under the app's content policy.
# - An SBOM in CycloneDX for what ships.
# - On a release: that the report signing key is there and is ours.
#
# Last, it collects the results into secure-code-check-results, which the
# release turns into the signed report and the public page
# (release-evidence.yml). Tools are pinned to a version and checked
# against a published hash or an image digest; actions are pinned to a
# commit. Runs with a read-only token.

on:
  workflow_call:
    inputs:
      tools-ref:
        description: Commit of Dishairano/hardwave-daw to take the scripts (scripts/secure-code-check) from; the same one as in `uses:`
        type: string
        required: true
      config:
        description: The product's config file
        type: string
        default: security/secure-code-check/config.toml
      cargo-manifests:
        description: One Cargo.toml per line; each is checked with the repository's deny.toml
        type: string
        default: Cargo.toml
      cargo-deny-workspace:
        description: Check every crate of each manifest's workspace (build tools such as xtask too), not only the root package
        type: boolean
        default: false
      npm-audit:
        description: 'One folder with a package-lock.json per line; "<dir>" audits every package, "<dir> --omit=dev" only what ships'
        type: string
        default: ''
      semgrep-languages:
        description: Languages whose security rules Semgrep runs (rust, typescript, javascript)
        type: string
        default: rust
      fuzz:
        description: Run every target under fuzz/fuzz_targets
        type: boolean
        default: false
      fuzz-seconds:
        description: Seconds each fuzz target runs
        type: number
        default: 60
      fuzz-apt-packages:
        description: System packages the fuzz targets need to build
        type: string
        default: ''
      content-policy-dir:
        description: 'Folder whose "npm run check:csp" loads the built interface under the app''s content policy; empty for none'
        type: string
        default: ''
      require-signing-key:
        description: Fail unless the report signing key is set and matches (releases)
        type: boolean
        default: false
    secrets:
      SECURE_CODE_CHECK_SIGNING_KEY:
        description: Signs the report; without it (a fork, a pull request from one) the preview stays unsigned
        required: false

permissions:
  contents: read

env:
  SCC_TOOLS_REPO: Dishairano/hardwave-daw

jobs:
  # Advisories and licences run as separate steps so the report can say
  # which of the two failed; the job fails if either does.
  rust-dependencies:
    name: Rust dependencies (cargo deny)
    runs-on: ubuntu-latest
    outputs:
      advisories: ${{ steps.deny.outputs.advisories }}
      licences: ${{ steps.deny.outputs.licences }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch cargo-deny, checked against its published hash
        run: >-
          curl -sSLo deny.tgz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          && echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  deny.tgz" | sha256sum -c -
          && mkdir -p deny-bin && tar xzf deny.tgz -C deny-bin --strip-components=1
          && install -m755 deny-bin/cargo-deny "$HOME/.cargo/bin/cargo-deny" && rm -rf deny.tgz deny-bin
      - name: Every lock file, against deny.toml
        id: deny
        env:
          MANIFESTS: ${{ inputs.cargo-manifests }}
          WORKSPACE: ${{ inputs.cargo-deny-workspace }}
        run: |
          [ -f deny.toml ] || { echo "::error::deny.toml is missing at the root of the repository"; exit 1; }
          scope=()
          [ "$WORKSPACE" = true ] && scope=(--workspace)
          advisories=success
          licences=success
          while IFS= read -r manifest; do
            manifest="$(echo "$manifest" | xargs)"
            [ -n "$manifest" ] || continue
            echo "::group::$manifest: advisories, yanked and unmaintained crates, bans, sources"
            cargo-deny --color always --manifest-path "$manifest" "${scope[@]}" --config deny.toml \
              check advisories bans sources || advisories=failure
            echo "::endgroup::"
            echo "::group::$manifest: licences"
            cargo-deny --color always --manifest-path "$manifest" "${scope[@]}" --config deny.toml \
              check licenses || licences=failure
            echo "::endgroup::"
          done <<< "$MANIFESTS"
          echo "advisories=$advisories" >> "$GITHUB_OUTPUT"
          echo "licences=$licences" >> "$GITHUB_OUTPUT"
          echo "advisories: $advisories, licences: $licences"
          [ "$advisories" = success ] && [ "$licences" = success ]

  npm-dependencies:
    name: npm dependencies (npm audit)
    if: inputs.npm-audit != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Audit each lock file
        env:
          FOLDERS: ${{ inputs.npm-audit }}
        run: |
          result=0
          while IFS= read -r line; do
            line="$(echo "$line" | xargs)"
            [ -n "$line" ] || continue
            folder="${line%% *}"
            extra=""
            [ "$folder" != "$line" ] && extra="${line#* }"
            case "$extra" in ""|--omit=dev) ;; *) echo "::error::npm-audit: unknown option '$extra'"; exit 1 ;; esac
            echo "::group::$folder ${extra:-(build tools included)}"
            (cd "$folder" && npm audit --audit-level=moderate $extra) || result=1
            echo "::endgroup::"
          done <<< "$FOLDERS"
          exit "$result"

  secrets:
    name: Secrets in history (gitleaks)
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.scan.outputs.commits }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch gitleaks, checked against its published hash
        run: >-
          curl -sSLo "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          && echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          && tar xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      # A finding that is not a secret is listed in .gitleaksignore by its
      # fingerprint, with the reason in a comment above it; nothing else
      # is skipped.
      - name: Scan every commit
        id: scan
        run: |
          echo "commits=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  # Semgrep Community Edition with the free rules from semgrep-rules, both
  # pinned: the image by digest, the rules by commit. Only the security
  # rules for the languages the product is written in, so a finding means
  # a possible flaw and not a style opinion. Left out: unsafe-usage, which
  # flags every unsafe block; plug-in and host code needs them for the
  # CLAP and VST3 C interfaces and the system APIs, and Clippy and review
  # cover them. The report says so. Severity ERROR is "high" and fails the
  # run; WARNING and INFO are listed in the report for review. The scan
  # runs with metrics off: nothing about our code leaves the runner.
  static-analysis:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    outputs:
      high: ${{ steps.gate.outputs.high }}
      medium: ${{ steps.gate.outputs.medium }}
      low: ${{ steps.gate.outputs.low }}
      rules: ${{ steps.gate.outputs.rules }}
      files: ${{ steps.gate.outputs.files }}
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SCC_TOOLS_REPO }}
          ref: ${{ inputs.tools-ref }}
          path: scc-tools
          sparse-checkout: scripts/secure-code-check
          persist-credentials: false
      - name: Free rules, pinned to a commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
          path: semgrep-rules
          persist-credentials: false
      - name: Pick the security rules for the product's languages
        env:
          LANGUAGES: ${{ inputs.semgrep-languages }}
        run: |
          mkdir rules
          folders=()
          for language in $LANGUAGES; do
            case "$language" in
              rust|typescript|javascript) folders+=("semgrep-rules/$language") ;;
              *) echo "::error::semgrep-languages: unknown language '$language'"; exit 1 ;;
            esac
          done
          [ "${#folders[@]}" -gt 0 ] || { echo "::error::semgrep-languages is empty"; exit 1; }
          find "${folders[@]}" \
            -path '*/security/*' \( -name '*.yaml' -o -name '*.yml' \) \
            ! -name '*.test.*' ! -name '*.fixed.*' ! -name 'unsafe-usage.*' -print0 \
            | while IFS= read -r -d '' rule; do
                install -D -m644 "$rule" "rules/${rule#semgrep-rules/}"
              done
          echo "$(find rules -type f | wc -l) rule files for: $LANGUAGES"
      # The source and rules are mounted read-only (the image expects the
      # code at /src) and the results come back on stdout, so the
      # container never writes into the workspace.
      - name: Scan the source
        run: >-
          docker run --rm -v "$PWD/src:/src:ro" -v "$PWD/rules:/rules:ro" -w /src -e HOME=/tmp
          "$SEMGREP_IMAGE" semgrep scan --config /rules --metrics off --disable-version-check
          --json > semgrep.json
      - name: High findings fail
        id: gate
        run: python3 scc-tools/scripts/secure-code-check/semgrep_gate.py semgrep.json rules
      - name: Keep the findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-results
          path: semgrep.json
          if-no-files-found: ignore
          retention-days: 90

  fuzz-targets:
    name: Fuzz targets
    if: inputs.fuzz
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
      seconds: ${{ steps.list.outputs.seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: One job per target
        id: list
        env:
          SECONDS_EACH: ${{ inputs.fuzz-seconds }}
        run: |
          targets=$(find fuzz/fuzz_targets -maxdepth 1 -name '*.rs' -printf '%f\n' | sed 's/\.rs$//' | sort \
            | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))')
          [ "$targets" != "[]" ] || { echo "::error::fuzz is on but fuzz/fuzz_targets has no targets"; exit 1; }
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "seconds=$SECONDS_EACH" >> "$GITHUB_OUTPUT"
          echo "$targets, $SECONDS_EACH s each"

  # One job per target, side by side.
  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: fuzz-targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly Rust (libFuzzer needs it)
        run: rustup toolchain install nightly --profile minimal
      - name: Fetch cargo-fuzz, checked against its published hash
        run: >-
          curl -sSLo cargo-fuzz.tgz https://github.com/rust-fuzz/cargo-fuzz/releases/download/0.13.2/cargo-fuzz-0.13.2-x86_64-unknown-linux-musl.tar.gz
          && echo "b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c  cargo-fuzz.tgz" | sha256sum -c -
          && mkdir -p cargo-fuzz-bin && tar xzf cargo-fuzz.tgz -C cargo-fuzz-bin
          && install -m755 "$(find cargo-fuzz-bin -name cargo-fuzz -type f | head -1)" "$HOME/.cargo/bin/cargo-fuzz"
      - name: System libraries the targets link
        if: inputs.fuzz-apt-packages != ''
        env:
          PACKAGES: ${{ inputs.fuzz-apt-packages }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $PACKAGES
      - name: Build the target
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +nightly fuzz build -O --target x86_64-unknown-linux-gnu "$TARGET"
      - name: Run it
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_EACH: ${{ needs.fuzz-targets.outputs.seconds }}
        run: >-
          cargo +nightly fuzz run -O --target x86_64-unknown-linux-gnu "$TARGET" --
          -max_total_time="$SECONDS_EACH" -rss_limit_mb=2048 -timeout=10
      - name: Keep what broke it
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts
          retention-days: 30

  content-policy:
    name: App window content policy
    if: inputs.content-policy-dir != ''
    # Pinned: Playwright 1.58 cannot install Chromium on Ubuntu 26.04,
    # which ubuntu-latest became on 21 Oct 2026.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Build the interface
        working-directory: ${{ inputs.content-policy-dir }}
        run: npm ci && npm run build
      - name: Browser for the check
        working-directory: ${{ inputs.content-policy-dir }}
        run: npx playwright install --with-deps chromium
      - name: Load the build under the app's policy; anything blocked fails
        working-directory: ${{ inputs.content-policy-dir }}
        run: npm run check:csp

  # What ships, as CycloneDX 1.5 JSON, one file per part named in the
  # product's config. Rust: the CycloneDX project's own cargo-cyclonedx,
  # from the lock files, for the target the config names and with every
  # feature on, the same graph cargo deny checks. npm: the CycloneDX
  # project's cyclonedx-npm, from the lock files, runtime packages only.
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SCC_TOOLS_REPO }}
          ref: ${{ inputs.tools-ref }}
          path: .scc-tools
          sparse-checkout: scripts/secure-code-check
          persist-credentials: false
      - name: The product's config is complete
        env:
          CONFIG: ${{ inputs.config }}
        run: python3 .scc-tools/scripts/secure-code-check/config.py check "$CONFIG"
      - name: Fetch cargo-cyclonedx, checked against its published hash
        run: >-
          curl -sSLo "$RUNNER_TEMP/cyclonedx.txz" https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.9/cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz
          && echo "fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8  $RUNNER_TEMP/cyclonedx.txz" | sha256sum -c -
          && mkdir -p "$RUNNER_TEMP/cyclonedx-bin" && tar xJf "$RUNNER_TEMP/cyclonedx.txz" -C "$RUNNER_TEMP/cyclonedx-bin"
          && install -m755 "$(find "$RUNNER_TEMP/cyclonedx-bin" -name cargo-cyclonedx -type f | head -1)" "$HOME/.cargo/bin/cargo-cyclonedx"
      - name: Rust crates
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/sbom"
          target="$(python3 .scc-tools/scripts/secure-code-check/config.py get "$CONFIG" sbom_target)"
          python3 .scc-tools/scripts/secure-code-check/config.py sbom-cargo "$CONFIG" > "$RUNNER_TEMP/cargo-parts.tsv"
          cut -f1 "$RUNNER_TEMP/cargo-parts.tsv" | sort -u | while IFS= read -r manifest; do
            echo "cargo cyclonedx: $manifest, target $target"
            cargo cyclonedx --manifest-path "$manifest" --format json --spec-version 1.5 \
              --target "$target" --all-features -q
          done
          while IFS=$'\t' read -r manifest output file; do
            [ -f "$output" ] || { echo "::error::cargo-cyclonedx wrote no $output (config: output)"; exit 1; }
            mv "$output" "$RUNNER_TEMP/sbom/$file"
          done < "$RUNNER_TEMP/cargo-parts.tsv"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: npm packages
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          set -e
          python3 .scc-tools/scripts/secure-code-check/config.py sbom-npm "$CONFIG" > "$RUNNER_TEMP/npm-parts.tsv"
          [ -s "$RUNNER_TEMP/npm-parts.tsv" ] || { echo "No npm parts"; exit 0; }
          # The pinned SBOM tool, every package checked against its lockfile hash.
          (cd .scc-tools/scripts/secure-code-check/sbom-tool && npm ci --ignore-scripts --no-audit --no-fund)
          tool="$PWD/.scc-tools/scripts/secure-code-check/sbom-tool/node_modules/.bin/cyclonedx-npm"
          while IFS=$'\t' read -r folder file; do
            (cd "$folder" && "$tool" --package-lock-only --omit dev --spec-version 1.5 \
              --output-reproducible --output-file "$RUNNER_TEMP/sbom/$file")
          done < "$RUNNER_TEMP/npm-parts.tsv"
      - name: Count what is in them
        run: python3 .scc-tools/scripts/secure-code-check/sbom_summary.py "$RUNNER_TEMP/sbom"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
          retention-days: 90

  # A release report must be signed, and the evidence job only runs after
  # the release files are public. So a release checks the key here,
  # before anything is built: a missing or wrong key stops the release
  # while there is still nothing to take back.
  signing-key:
    name: Report signing key
    if: inputs.require-signing-key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SCC_TOOLS_REPO }}
          ref: ${{ inputs.tools-ref }}
          path: .scc-tools
          sparse-checkout: scripts/secure-code-check
          persist-credentials: false
      - name: The key is set and matches the public key in the repository
        env:
          SECURE_CODE_CHECK_SIGNING_KEY: ${{ secrets.SECURE_CODE_CHECK_SIGNING_KEY }}
        run: .scc-tools/scripts/secure-code-check/sign.sh check

  # Writes down what every job above found, also when one failed, so a
  # red run still says which check stopped it. The release adds its own
  # results to this and signs it.
  results:
    name: Collect the results
    if: always()
    needs:
      - rust-dependencies
      - npm-dependencies
      - secrets
      - static-analysis
      - fuzz-targets
      - fuzz
      - content-policy
      - sbom
      - signing-key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The date each exception was recorded comes from deny.toml's history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SCC_TOOLS_REPO }}
          ref: ${{ inputs.tools-ref }}
          path: .scc-tools
          sparse-checkout: scripts/secure-code-check
          persist-credentials: false
      - name: The report scripts' own tests
        run: python3 -m unittest discover -s .scc-tools/scripts/secure-code-check -p 'test_*.py'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: sbom
          path: ${{ runner.temp }}/scc/sbom
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: semgrep-results
          path: ${{ runner.temp }}/scc
      - name: Write the results and a preview of the report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
          CONFIG: ${{ inputs.config }}
          SCC: ${{ runner.temp }}/scc
        run: |
          set -e
          mkdir -p "$SCC"
          printf '%s' "$NEEDS_JSON" > "$SCC/scan-needs.json"
          printf '%s' "$INPUTS_JSON" > "$SCC/scan-inputs.json"
          python3 .scc-tools/scripts/secure-code-check/report.py --repo . --config "$CONFIG" --scan-dir "$SCC" --record-scan
          python3 .scc-tools/scripts/secure-code-check/report.py --repo . --config "$CONFIG" --scan-dir "$SCC" --out-dir "$SCC/preview"
          echo "Preview: secure-code-check-results artifact, preview/"
      - name: Sign the preview
        env:
          SECURE_CODE_CHECK_SIGNING_KEY: ${{ secrets.SECURE_CODE_CHECK_SIGNING_KEY }}
          SCC: ${{ runner.temp }}/scc
        run: |
          if [ -z "$SECURE_CODE_CHECK_SIGNING_KEY" ]; then
            echo "No signing key in this run; the preview stays unsigned."
            exit 0
          fi
          .scc-tools/scripts/secure-code-check/sign.sh sign "$SCC"/preview/*-secure-code-check.json "$SCC"/preview/*-secure-code-check.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secure-code-check-results
          path: ${{ runner.temp }}/scc
          retention-days: 90
      # The report, its signatures and the SBOMs, on their own for reading.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secure-code-check-report
          path: ${{ runner.temp }}/scc/preview
          retention-days: 90

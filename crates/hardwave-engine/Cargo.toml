[package]
name = "hardwave-engine"
version.workspace = true
edition.workspace = true

[features]
default = []
jack = ["hardwave-audio-io/jack"]
asio = ["hardwave-audio-io/asio"]

[dependencies]
hardwave-audio-io = { path = "../hardwave-audio-io" }
hardwave-midi = { path = "../hardwave-midi" }
hardwave-plugin-host = { path = "../hardwave-plugin-host" }
hardwave-project = { path = "../hardwave-project" }
hardwave-metering = { path = "../hardwave-metering" }
hardwave-dsp = { path = "../hardwave-dsp" }

rtrb.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
atomic_float.workspace = true
petgraph.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
uuid.workspace = true
# raw-window-handle is exposed transitively via hardwave-plugin-host's
# `HostedPlugin::open_editor` signature; we depend on it directly so test
# mocks of the trait can name the type without the path leaking.
raw-window-handle.workspace = true


[dev-dependencies]
hound.workspace = true
# Needed by functional_smoke's mock `HostedPlugin` — the trait's `open_editor`
# names `raw_window_handle::RawWindowHandle`, a transitive dep not otherwise
# nameable from the integration-test crate.
raw-window-handle.workspace = true

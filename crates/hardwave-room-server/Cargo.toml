[package]
name = "hardwave-room-server"
version.workspace = true
edition.workspace = true
license.workspace = true

# The service two DAWs meet in. Small on purpose: it holds rooms in
# memory, checks the account on the way in, and passes messages on.

[[bin]]
name = "hardwave-room-server"
path = "src/main.rs"

[lib]
name = "hardwave_room_server"
path = "src/lib.rs"

[dependencies]
hardwave-room = { path = "../hardwave-room" }
hardwave-project = { path = "../hardwave-project" }
hardwave-account = { path = "../hardwave-account" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
parking_lot = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.24"
